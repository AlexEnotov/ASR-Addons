name: Check and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Validate release structure
        shell: pwsh
        run: ./tools/package.ps1 -Tag v0.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: package-preview
          path: release/*
